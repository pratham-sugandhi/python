<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="main-heading">AI Personal Assistant</h1>
    <div class="container">
        <h2>Ask a Question</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask any anything.." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ask-loading" style="display: none;">Processing your question...</p>
        <p id="ask-response"></p>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea name="email" placeholder="Paste your email here..." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="email-loading" style="display: none;">Summarizing your email...</p>
        <p id="email-response"></p>
    </div>


    <script>
        document.getElementById('askForm').onsubmit = async function(event) {
            event.preventDefault();

            let formData = new FormData(event.target);
            let loading = document.getElementById('ask-loading');
            loading.style.display = 'block';

            let res = await fetch('/ask', {
                method: 'POST',
                body: formData
            });

            let data = await res.json();
            document.getElementById('ask-response').innerText = data.response;

            loading.style.display = 'none';
        };

        document.getElementById('emailForm').onsubmit = async function(event) {
            event.preventDefault();

            let formData = new FormData(event.target);
            let loading = document.getElementById('email-loading');
            loading.style.display = 'block';

            let res = await fetch('/summarize', {
                method: 'POST',
                body: formData
            });

            let data = await res.json();
            document.getElementById('email-response').innerText = data.summary;

            loading.style.display = 'none';
            
        }
    </script>
</body>
</html>
