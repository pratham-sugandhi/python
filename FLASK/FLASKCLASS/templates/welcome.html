<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>
<body>
    {{ header | safe }}
    <h1>Welcome, {{ username }}!</h1>

    {% if password %}
        <p>Your password is: {{ password }}</p>
    {% else %}
        <p>No password provided.</p>
    {% endif %}

    <h2>Your Friends:</h2>
    <ul>
        {% for friend in friends %}
            <li>{{ friend }}</li>
        {% endfor %}
    </ul>

</body>
</html>
